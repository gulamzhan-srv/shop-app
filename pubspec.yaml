name: shop_app
description: Касса и учёт для маленького магазина. Данные на телефоне, синхронизация через Google Диск.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  uuid: ^4.4.0
  crypto: ^3.0.3
  shared_preferences: ^2.2.3
  intl: any                     # версию задаёт сам Flutter
  google_fonts: ^6.2.1
  # Шаг 2: товары
  image_picker: ^1.1.2          # фото с камеры или из галереи
  flutter_image_compress: ^2.3.0 # сжатие фото до 200 КБ
  path_provider: ^2.1.4         # папка приложения для фото
  mobile_scanner: ^5.2.3        # сканер штрихкода камерой
  # Шаг 3: поступление
  device_info_plus: ^10.1.2     # название телефона в документе
  # Шаг 5: уведомления о долгах
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  # Шаг 7: курсы валют
  http: ^1.2.2
  # Шаг 8: вход Google и Google Диск
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  # Печать накладных (PDF: печать, сохранение, отправка в WhatsApp и т.п.)
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/fonts/
